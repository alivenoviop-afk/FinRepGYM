name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Официальная проверка требует Python 3.11 — гоняем именно его
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Внешних зависимостей нет: только стандартная библиотека, pip не нужен
      - name: Юнит-тесты (контракт, данные, награда, атаки, пермутации)
        run: python -m unittest discover -s tests -v

      # Единая команда проверки: свипы, атаки, детерминизм, утечки, парные проверки
      - name: Единая команда проверки
        run: python scripts/check.py

      # Репетиция протокола регламента: 20 эпизодов (5/5/5/5) x 4 политики
      - name: Репетиция закрытой проверки (20 эпизодов x 4 политики)
        run: python scripts/organizer_check.py

      # Параметрический аудит: каждый пункт разделов ТЗ 02-12 -> PASS/FAIL
      - name: Параметрический аудит ТЗ (spec_audit)
        run: python scripts/spec_audit.py

      # Замер ресурсов (спека 07: 2 CPU, 4 ГБ RAM, 1 ГБ на решение)
      - name: Замер памяти и размера (лимиты регламента)
        run: |
          /usr/bin/time -v python scripts/check.py > /dev/null 2> time.txt || true
          grep -E "Maximum resident set size|Elapsed \(wall" time.txt
          RSS=$(grep "Maximum resident" time.txt | grep -oE "[0-9]+" | head -1)
          SIZE_KB=$(du -sk . | cut -f1)
          echo "RSS: ${RSS} байт (лимит 4 ГБ)"
          echo "Размер решения: $((SIZE_KB / 1024)) МБ (лимит 1024 МБ)"
          test -n "$RSS"
          test "$RSS" -lt $((4 * 1024 * 1024 * 1024))
          test "$SIZE_KB" -lt $((1024 * 1024))

  container:
    # Инструкция контейнера (пункт сдачи) проверяется здесь же:
    # образ собирается из Python 3.11 и проверка запускается ВНУТРИ него.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа (python:3.11-slim, без зависимостей)
        run: docker build -t audit-rl-env .

      - name: Единая команда проверки внутри контейнера
        run: docker run --rm audit-rl-env
