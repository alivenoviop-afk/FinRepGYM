name: tests

on:
  push:
  pull_request:

jobs:
  unittest:
    # Матрица 3 ОС x 2 версии Python. Главная цель — одна и та же эталонная
    # константа отпечатка (seed=42) совпадает везде: формальное доказательство
    # спеки 04 «одинаковые seed, config, ВЕРСИЯ и действия воспроизводят записи»
    # независимо от ОС, железа и версии Python.
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      # Внешних зависимостей нет: только стандартная библиотека, pip не нужен
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # Кросс-платформенный контроль: один хеш на Windows, Linux и macOS
      - name: Отпечаток эпизода seed=42 (одна константа на всех ОС и версиях)
        run: python scripts/golden_hash.py

      - name: Юнит-тесты (контракт, данные, награда, атаки, пермутации)
        run: python -m unittest discover -s tests -v

      # Единая команда проверки: свипы, атаки, детерминизм, утечки, парные проверки
      - name: Единая команда проверки
        run: python scripts/check.py

      # Репетиция протокола регламента: 20 эпизодов (5/5/5/5) x 4 политики
      - name: Репетиция закрытой проверки (20 эпизодов x 4 политики)
        run: python scripts/organizer_check.py

      # Параметрический аудит: каждый пункт разделов ТЗ 02-12 -> PASS/FAIL
      - name: Параметрический аудит ТЗ (spec_audit)
        run: python scripts/spec_audit.py

      # Слепая проверка на условиях оценщиков: свежие seed и новые сочетания
      - name: Слепая проверка условий оценщиков (jury_conditions)
        run: python scripts/jury_conditions.py

      # Марафон: оценки жюри подряд (стабильность и ресурсы)
      - name: Марафон оценок жюри (3 подряд)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python scripts/jury_marathon.py --runs 3

      - name: Марафон оценок жюри (1 оценка на этой платформе)
        if: ${{ !(matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11') }}
        run: python scripts/jury_marathon.py --runs 1

      # Офлайн-доказательство: без site-packages (сторонних пакетов нет вообще)
      - name: Офлайн-режим (python -S, без site-packages)
        run: python -S -m unittest discover -s tests

      # Измеренные запасы до лимитов регламента (60 с / 4 ГБ / 100 шагов / 1 ГБ)
      - name: Бенчмарк запасов (время, память, размер)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: python scripts/benchmark.py

      # Замер ресурсов (спека 07: 2 CPU, 4 ГБ RAM, 1 ГБ на решение)
      - name: Замер памяти и размера (лимиты регламента)
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        run: |
          /usr/bin/time -v python scripts/check.py > /dev/null 2> time.txt || true
          grep -E "Maximum resident set size|Elapsed \(wall" time.txt
          RSS=$(grep "Maximum resident" time.txt | grep -oE "[0-9]+" | head -1)
          SIZE_KB=$(du -sk . | cut -f1)
          echo "RSS: ${RSS} байт (лимит 4 ГБ)"
          echo "Размер решения: $((SIZE_KB / 1024)) МБ (лимит 1024 МБ)"
          test -n "$RSS"
          test "$RSS" -lt $((4 * 1024 * 1024 * 1024))
          test "$SIZE_KB" -lt $((1024 * 1024))

  container:
    # Инструкция контейнера (пункт сдачи) проверяется здесь же:
    # образ собирается из Python 3.11 и проверка запускается ВНУТРИ него.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Сборка образа (python:3.11-slim, без зависимостей)
        run: docker build -t finrepgym .

      - name: Единая команда проверки внутри контейнера
        run: docker run --rm finrepgym
